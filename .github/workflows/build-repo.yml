name: Build APT repository

on:
  push:
    branches: [main]
    paths-ignore:
      - 'Packages'
      - 'Packages.gz'
      - 'Release'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install APT tooling
        run: sudo apt-get update && sudo apt-get install -y dpkg-dev apt-utils

      - name: Build Packages indexes
        run: |
          dpkg-scanpackages pool /dev/null > Packages
          gzip -9c Packages > Packages.gz

      - name: Build Release metadata
        run: |
          apt-ftparchive \
            -o APT::FTPArchive::Release::Origin="MefinRepo" \
            -o APT::FTPArchive::Release::Label="MefinRepo" \
            -o APT::FTPArchive::Release::Suite="stable" \
            -o APT::FTPArchive::Release::Codename="ios" \
            -o APT::FTPArchive::Release::Architectures="iphoneos-arm iphoneos-arm64" \
            -o APT::FTPArchive::Release::Components="main" \
            release . > Release

      - name: Commit generated metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Packages Packages.gz Release
          if git diff --cached --quiet; then
            echo "No metadata changes."
          else
            git commit -m "chore: rebuild APT metadata"
            git push
          fi
