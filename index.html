<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="MefinRepo — APT repository for Sileo.">
  <title>MefinRepo</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", sans-serif;
      --bg: #08090c;
      --card: rgba(255,255,255,.055);
      --line: rgba(255,255,255,.1);
      --text: #f5f7fb;
      --muted: #9ca3b1;
      --accent: #8b7cff;
      --accent-2: #5eead4;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--text);
      background:
        radial-gradient(circle at 20% 10%, rgba(139,124,255,.18), transparent 34%),
        radial-gradient(circle at 80% 85%, rgba(94,234,212,.11), transparent 32%),
        var(--bg);
      overflow-x: hidden;
    }

    .noise {
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: .035;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.5'/%3E%3C/svg%3E");
    }

    main {
      width: min(920px, calc(100% - 32px));
      margin: 0 auto;
      padding: 80px 0 56px;
    }

    .hero { text-align: center; }

    .mark {
      width: 76px;
      height: 76px;
      margin: 0 auto 24px;
      display: grid;
      place-items: center;
      border: 1px solid var(--line);
      border-radius: 24px;
      background: linear-gradient(145deg, rgba(139,124,255,.25), rgba(255,255,255,.06));
      box-shadow: 0 24px 80px rgba(0,0,0,.35), inset 0 1px rgba(255,255,255,.14);
      font-size: 28px;
      font-weight: 750;
      letter-spacing: -.06em;
    }

    h1 {
      margin: 0;
      font-size: clamp(46px, 9vw, 82px);
      line-height: .95;
      letter-spacing: -.065em;
    }

    .subtitle {
      max-width: 560px;
      margin: 22px auto 0;
      color: var(--muted);
      font-size: 18px;
      line-height: 1.6;
    }

    .repo {
      max-width: 680px;
      margin: 38px auto 0;
      padding: 8px;
      display: flex;
      gap: 8px;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: rgba(255,255,255,.055);
      backdrop-filter: blur(18px);
      box-shadow: 0 24px 70px rgba(0,0,0,.28);
    }

    .repo code {
      min-width: 0;
      flex: 1;
      display: flex;
      align-items: center;
      padding: 0 14px;
      overflow: hidden;
      color: #d9dce5;
      white-space: nowrap;
      text-overflow: ellipsis;
      font-size: 14px;
    }

    button, .button {
      border: 0;
      border-radius: 13px;
      padding: 13px 18px;
      color: white;
      background: linear-gradient(135deg, #8b7cff, #6c5ce7);
      font: inherit;
      font-weight: 650;
      cursor: pointer;
      text-decoration: none;
      transition: transform .18s ease, filter .18s ease;
    }

    button:hover, .button:hover { transform: translateY(-1px); filter: brightness(1.08); }
    button:active, .button:active { transform: translateY(0); }

    .grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-top: 52px;
    }

    .card {
      padding: 22px;
      min-height: 128px;
      border: 1px solid var(--line);
      border-radius: 20px;
      background: var(--card);
      backdrop-filter: blur(16px);
    }

    .label {
      color: #818796;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: .1em;
    }

    .value {
      margin-top: 12px;
      font-size: 24px;
      font-weight: 700;
      letter-spacing: -.035em;
    }

    .links {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-top: 28px;
    }

    .links a {
      padding: 10px 14px;
      border: 1px solid var(--line);
      border-radius: 12px;
      color: #c9cdd7;
      text-decoration: none;
      background: rgba(255,255,255,.035);
      transition: background .18s ease, border-color .18s ease;
    }

    .links a:hover {
      background: rgba(255,255,255,.08);
      border-color: rgba(255,255,255,.18);
    }

    footer {
      margin-top: 72px;
      text-align: center;
      color: #626978;
      font-size: 13px;
    }

    @media (max-width: 680px) {
      main { padding-top: 52px; }
      .repo { flex-direction: column; }
      .repo code { padding: 13px 12px; }
      .grid { grid-template-columns: 1fr; }
      .links { flex-wrap: wrap; }
    }
  </style>
</head>
<body>
  <div class="noise"></div>

  <main>
    <section class="hero">
      <div class="mark">M</div>
      <h1>MefinRepo</h1>
      <p class="subtitle">A lightweight APT repository for Sileo, built with GitHub Pages and automated package metadata.</p>

      <div class="repo">
        <code id="repo-url">https://skufor.github.io/MefinRepo/</code>
        <button id="copy" type="button">Copy source</button>
      </div>

      <div class="links">
        <a href="Packages">Packages</a>
        <a href="Release">Release</a>
        <a href="Packages.gz">Packages.gz</a>
      </div>
    </section>

    <section class="grid" aria-label="Repository status">
      <article class="card">
        <div class="label">Status</div>
        <div class="value" id="status">Online</div>
      </article>
      <article class="card">
        <div class="label">Packages</div>
        <div class="value" id="count">Checking…</div>
      </article>
      <article class="card">
        <div class="label">Format</div>
        <div class="value">APT / Sileo</div>
      </article>
    </section>

    <footer>MefinRepo · Repository metadata is generated automatically.</footer>
  </main>

  <script>
    const repoUrl = document.getElementById("repo-url").textContent;
    const copy = document.getElementById("copy");

    copy.addEventListener("click", async () => {
      try {
        await navigator.clipboard.writeText(repoUrl);
        copy.textContent = "Copied";
        setTimeout(() => copy.textContent = "Copy source", 1400);
      } catch {
        copy.textContent = "Copy failed";
        setTimeout(() => copy.textContent = "Copy source", 1400);
      }
    });

    fetch("Packages", { cache: "no-store" })
      .then(r => r.ok ? r.text() : Promise.reject())
      .then(text => {
        const count = (text.match(/^Package:\s/gm) || []).length;
        document.getElementById("count").textContent = count === 1 ? "1 package" : count + " packages";
      })
      .catch(() => {
        document.getElementById("count").textContent = "Unavailable";
      });
  </script>
</body>
</html>
